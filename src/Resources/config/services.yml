services:
  _defaults:
    autowire: true
    autoconfigure: true

  NS\DistanceBundle\Command\CalculateCommand: ~
  NS\DistanceBundle\Command\DownloadPostalCodesCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'
  NS\DistanceBundle\Command\ImportPostalCodesCommand: ~

  NS\DistanceBundle\Controller\RestController:
    tags: ['controller.service_arguments']
    public: true

  NS\DistanceBundle\Services\DistanceCalculator: ~

  NS\DistanceBundle\Services\PostalCodeChecker:
    arguments:
      $apiKey: '%ns_distance.api_key%'

  ns_distance.postalcode_checker:
    alias: NS\DistanceBundle\Services\PostalCodeChecker
    public: true

  ns_distance.calculator:
    alias: NS\DistanceBundle\Services\DistanceCalculator
    public: true
